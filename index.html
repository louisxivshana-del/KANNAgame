<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6e7cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KANNA">
  <title>KANNA — 顔合体パズル</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="ui">
      <!-- プレイ中のボタン -->
      <div id="hud" hidden>
        <button id="btn-pause" aria-label="一時停止">Ⅱ</button>
        <button id="btn-sound" aria-label="音のオン・オフ">♪</button>
      </div>

      <!-- タイトル -->
      <section id="scr-title" class="screen">
        <div class="panel">
          <h1>KANNA</h1>
          <p class="sub">顔合体パズル</p>
          <button id="btn-start" class="primary">スタート</button>
          <button id="btn-rank">ランキング</button>
          <button id="btn-faces">顔ピース登録</button>
          <p class="note" id="offline-note" hidden>✓ オフラインでも遊べます</p>
        </div>
      </section>

      <!-- リザルト -->
      <section id="scr-result" class="screen">
        <div class="panel">
          <h2>GAME OVER</h2>
          <p class="big" id="res-score">0</p>
          <p class="note" id="res-detail"></p>
          <form id="rankin" autocomplete="off">
            <p class="rankin-title" id="rankin-title">ランクイン！</p>
            <label for="name-input">名前を入力してください</label>
            <input id="name-input" maxlength="10" placeholder="なまえ" enterkeyhint="done">
            <button type="submit" class="primary">登録する</button>
          </form>
          <div id="res-buttons">
            <p class="note" id="res-best"></p>
            <button id="btn-retry" class="primary">もう一度</button>
            <button id="btn-res-rank">ランキング</button>
            <button id="btn-res-title">タイトルへ</button>
          </div>
        </div>
      </section>

      <!-- ランキング -->
      <section id="scr-ranking" class="screen">
        <div class="panel">
          <h2>ランキング</h2>
          <ol id="rank-list"></ol>
          <p class="note" id="rank-empty">まだ記録がありません</p>
          <button id="btn-rank-play" class="primary">遊ぶ</button>
          <button id="btn-rank-title">タイトルへ</button>
        </div>
      </section>

      <!-- 一時停止 -->
      <section id="scr-pause" class="screen">
        <div class="panel">
          <h2>一時停止</h2>
          <button id="btn-resume" class="primary">続ける</button>
          <button id="btn-restart">最初から</button>
          <button id="btn-pause-title">タイトルへ</button>
        </div>
      </section>

      <!-- 顔ピース一覧 -->
      <section id="scr-faces" class="screen">
        <div class="panel">
          <h2>顔ピース登録</h2>
          <p class="note">レベルごとに写真を登録すると、切り抜いた形のピースになります。人は頭を自動で、動物などは切り抜きたいものをタップして切り抜けます。写真は端末の中だけで使われます。</p>
          <div id="face-grid"></div>
          <button id="btn-faces-back" class="primary">タイトルへ</button>
        </div>
      </section>

      <!-- 切り抜き調整 -->
      <section id="scr-editor" class="screen">
        <div class="panel editor">
          <h2 id="editor-title">切り抜き</h2>
          <div class="editor-wrap"><canvas id="editor-canvas"></canvas></div>
          <p class="note" id="editor-status"></p>
          <div class="row">
            <button id="ed-smaller">縮小</button>
            <button id="ed-bigger">拡大</button>
            <button id="ed-fit">枠を中央</button>
          </div>
          <div class="row">
            <button id="ed-auto">自動（頭）</button>
            <button id="ed-auto-face">顔だけ</button>
            <button id="ed-tap">タップで選ぶ</button>
          </div>
          <div class="row">
            <button id="ed-cancel">やめる</button>
            <button id="ed-save" class="primary">保存</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <input type="file" id="face-file" accept="image/*" hidden>

  <script src="vendor/decomp.min.js"></script>
  <script src="vendor/matter.min.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/ranking.js"></script>
  <script src="src/faces.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
